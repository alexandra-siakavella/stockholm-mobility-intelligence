services:
  postgres:
    image: postgres:16
    container_name: stockholm-mobility-postgres
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility_user
      POSTGRES_PASSWORD: mobility_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  